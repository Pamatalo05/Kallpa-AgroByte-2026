plugins { id 'com.android.application' }
android {
    namespace 'com.kallpa.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.kallpa.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { viewBinding true }
}
dependencies {
    // Mantener compatibles las versiones de Kotlin
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    // Librerías originales de Cristina
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    // Muyu web dentro de la app (WebViewAssetLoader): carga segura de assets/muyu/
    implementation 'androidx.webkit:webkit:1.12.1'
}
